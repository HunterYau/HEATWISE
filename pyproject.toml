[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-heat-risk-ai"
version = "0.2.0"
description = "Two-stage, leakage-safe urban UTCI modeling framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["UTCI", "urban heat", "environmental modeling", "spatiotemporal validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy==2.2.6",
  "pandas==3.0.3",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "xgboost==3.3.0",
  "optuna==4.9.0",
  "pythermalcomfort==4.0.2",
  "shap==0.52.0",
  "matplotlib==3.11.1",
  "seaborn==0.13.2",
  "PyYAML==6.0.3",
  "joblib==1.5.3",
  "pyarrow==25.0.0",
  "pyproj==3.7.2",
  "torch==2.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[project.scripts]
urban-heat-risk-ai = "urban_heat_risk_ai.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["urban_heat_risk_ai*"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
